name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Verify Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-cache iOS engine
        run: flutter precache --ios

      - name: Build iOS (generates podhelper.rb)
        run: flutter build ios --release --no-codesign

      - name: Check if podhelper.rb exists
        run: |
          if [ -f .ios/Flutter/podhelper.rb ]; then
            echo "✅ podhelper.rb encontrado!"
          else
            echo "❌ ERRO: podhelper.rb não foi gerado!"
            exit 1
          fi

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --verbose

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
