name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: pub Update
        run: flutter pub upgrade --major-versions

      - name: Install dependencies
        run: flutter pub get

      - name: Clean project
        run: flutter clean

      - name: Precache Flutter for iOS
        run: flutter precache --ios

      - name: Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods
          pod repo update

      - name: Fix Podfile for compatibility
        run: |
          sed -i.bak -E "s|load File.join\\(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'\\)|podhelper_path = File.join(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'); load podhelper_path if File.exist?(podhelper_path)|" ios/Podfile

      - name: Install pods
        run: |
          cd ios
          pod deintegrate
          pod install --verbose

      - name: Check if audio_session exists
        run: |
          if grep -q "audio_session" pubspec.yaml; then
            echo "audio_session encontrado, prosseguindo..."
          else
            echo "Erro: audio_session não encontrado no pubspec.yaml"
            exit 1
          fi

      - name: Build IPA (sem assinatura)
        run: flutter build ipa --release --no-codesign