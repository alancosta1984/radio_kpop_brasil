name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Precache iOS engine
        run: flutter precache --ios

      - name: Attempt to generate podhelper.rb
        run: flutter build ios --release --no-codesign || true

      - name: Verify podhelper.rb exists
        run: |
          if [ -f .dart_tool/flutter_build/ios/podhelper.rb ]; then
            echo "✅ podhelper.rb exists"
          else
            echo "⚠️ podhelper.rb not found (this may cause build issues)"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock || true
          pod install --verbose

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
