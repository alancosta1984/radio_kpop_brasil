name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Show Flutter version
        run: flutter --version

      - name: Clean Flutter project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Precache iOS engine
        run: flutter precache --ios

      - name: Build iOS (to generate podhelper.rb)
        run: flutter build ios --release --no-codesign

      - name: Confirm podhelper.rb was generated
        run: |
          if [ -f .dart_tool/flutter_build/ios/podhelper.rb ]; then
            echo "✅ podhelper.rb encontrado!"
          else
            echo "❌ ERRO: podhelper.rb não foi gerado!"
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --verbose

      - name: Confirm audio_session está no Podfile.lock
        run: |
          if grep -q "audio_session" ios/Podfile.lock; then
            echo "✅ audio_session instalado via CocoaPods"
          else
            echo "❌ ERRO: audio_session não está no Podfile.lock"
            exit 1
          fi

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
