name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clean Flutter project
        run: flutter clean

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Pre-cache Flutter (inclui engine iOS)
        run: flutter precache

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.12.1

      - name: Build iOS to generate podhelper.rb
        run: flutter build ios --release --no-codesign

      - name: Ajusta Podfile para carregar podhelper.rb se existir
        run: |
          sed -i.bak -E "s|load File.join\\(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'\\)|podhelper_path = File.join(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'); load podhelper_path if File.exist?(podhelper_path)|" ios/Podfile

      - name: CocoaPods clean + install
        run: |
          cd ios
          pod deintegrate
          pod install --repo-update

      - name: Build IPA
        run: flutter build ipa --release --no-codesign
