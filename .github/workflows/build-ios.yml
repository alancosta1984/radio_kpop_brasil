name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build
        run: flutter clean

      - name: Prebuild iOS to generate podhelper.rb
        run: flutter build ios --release --no-codesign

      - name: Remove broken test target from Podfile
        run: |
          sed -i.bak '/RunnerTests/d' ios/Podfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
