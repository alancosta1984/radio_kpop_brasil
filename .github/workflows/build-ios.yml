name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter clean
        run: flutter clean

      - name: Flutter precache (inclui iOS)
        run: flutter precache --ios

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod repo update

      - name: Adjust Podfile to avoid podhelper.rb errors
        run: |
          sed -i.bak -E "s|load File.join\\(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'\\)|podhelper_path = File.join(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'); load podhelper_path if File.exist?(podhelper_path)|" ios/Podfile

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Build IPA (sem assinatura)
        run: flutter build ipa --release --no-codesign
