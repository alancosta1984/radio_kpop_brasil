name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Precache iOS engine
        run: flutter precache --ios

      - name: Run build ios to generate podhelper.rb
        run: flutter build ios --release --no-codesign

      - name: Confirm podhelper.rb exists
        run: |
          if [ -f .dart_tool/flutter_build/ios/podhelper.rb ]; then
            echo "✅ podhelper.rb gerado!"
          else
            echo "❌ ERRO: podhelper.rb não gerado!"
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Confirm audio_session foi instalado
        run: |
          if grep -q "audio_session" ios/Podfile.lock; then
            echo "✅ audio_session está no Podfile.lock"
          else
            echo "❌ ERRO: audio_session NÃO está no Podfile.lock"
            exit 1
          fi

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
