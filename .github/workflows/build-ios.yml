name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Pre-cache Flutter (inclui engine iOS)
        run: flutter precache --ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      # ⚠️ Esse comando vai gerar o podhelper.rb SEM compilar ainda
      - name: Ensure podhelper.rb exists
        run: flutter build ios --no-codesign --simulator

      # ✅ Ajusta Podfile para evitar erro se podhelper.rb não existir
      - name: Adjust Podfile to load podhelper.rb only if exists
        run: |
          sed -i.bak -E "s|load File.join\\(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'\\)|podhelper_path = File.join(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb'); load podhelper_path if File.exist?(podhelper_path)|" ios/Podfile

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      # ✅ Só agora você compila para produção
      - name: Build IPA
        run: flutter build ipa --release --no-codesign
