name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'

      - name: Delete previous iOS pods and build data
        run: |
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Podfile.lock
          rm -rf .dart_tool
          rm -rf build
          rm -rf ios/Flutter/Generated.xcconfig
          rm -rf ios/Flutter/ephemeral

      - name: Forçar regeneração do GeneratedPluginRegistrant
        run: |
          rm -f ios/Runner/GeneratedPluginRegistrant.m
          rm -f ios/Runner/GeneratedPluginRegistrant.h

      - name: Flutter clean and get deps
        run: |
          flutter clean
          flutter pub get

      - name: Precache iOS
        run: flutter precache --ios

      - name: Build iOS to generate podhelper.rb
        run: flutter build ios --release --no-codesign

      - name: Check if podhelper.rb exists
        run: |
          if [ -f .ios/Flutter/podhelper.rb ]; then
            echo "✅ podhelper.rb encontrado!"
          else
            echo "❌ ERRO: podhelper.rb não foi gerado!"
            exit 1
          fi

      - name: CocoaPods install
        run: |
          cd ios
          pod deintegrate
          pod install --verbose

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
