name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Replace broken Podfile
        run: |
          cat > ios/Podfile <<EOF
          platform :ios, '12.0'

          use_frameworks!
          use_modular_headers!

          flutter_application_path = File.expand_path('../..', __FILE__)
          load File.join(flutter_application_path, '.dart_tool', 'flutter_build', 'ios', 'podhelper.rb')

          target 'Runner' do
            install_all_flutter_pods(flutter_application_path)
          end
          EOF

      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/ios/ipa/*.ipa
